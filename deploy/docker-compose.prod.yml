version: '3.9'

services:
  vehicle-tracker:
    image: vehicle-tracker:${IMAGE_VERSION:-1.0.0}
    container_name: vehicle-tracker
    restart: always
    ports:
      - "8081:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      STALE_THRESHOLD_MS: ${STALE_THRESHOLD_MS:-10000}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - vtnet
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 192M

networks:
  vtnet:
    driver: bridge
