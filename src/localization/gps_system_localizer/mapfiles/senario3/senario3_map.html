<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>시흥 Senario3 링크 지도 - 교차로/신호 정보</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
html, body { margin:0; padding:0; height:100%; font-family:'Pretendard','Noto Sans KR',sans-serif; }
#map { position:absolute; top:0; left:0; right:340px; bottom:0; background:#1a1a2e; }
#panel {
  position:absolute; top:0; right:0; bottom:0;
  width:340px; min-width:260px; background:#1e1e2e; color:#cdd6f4;
  overflow-y:auto; padding:12px; box-sizing:border-box; font-size:13px;
}
#panel h2 { font-size:14px; color:#89b4fa; border-bottom:1px solid #313244; padding-bottom:6px; margin-top:8px; }
.field-row { display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px solid #2a2a3a; }
.field-name { color:#a6e3a1; flex:0 0 130px; font-size:12px; }
.field-value { color:#cdd6f4; text-align:right; word-break:break-all; flex:1; }
.field-value.empty { color:#585b70; font-style:italic; }
.section-title { font-size:11px; color:#89b4fa; font-weight:bold; margin:10px 0 4px; padding-top:6px; border-top:1px solid #313244; }
#link-id-badge { font-size:12px; color:#f5c2e7; word-break:break-all; margin-bottom:4px; font-weight:bold; }
.legend-item { display:flex; align-items:center; gap:6px; padding:2px 0; font-size:11px; }
.legend-color { width:30px; height:4px; border-radius:2px; }
.hint { color:#585b70; font-size:12px; margin-top:4px; }
.filter-group { margin:8px 0; }
.filter-group label { font-size:11px; color:#bac2de; }
.filter-group select { background:#313244; color:#cdd6f4; border:1px solid #45475a; border-radius:4px; padding:3px 6px; font-size:11px; width:100%; margin-top:4px; }
.link-tooltip { background:rgba(30,30,46,0.85); color:#cdd6f4; border:1px solid #89b4fa; font-size:11px; padding:2px 6px; border-radius:3px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h2>Senario3 링크 지도</h2>
  <div class="section-title">연결 범례</div>
  <div class="legend-item"><div class="legend-color" style="background:#4fc3f7"></div> 기본 링크 (신호 없음)</div>
  <div class="legend-item"><div class="legend-color" style="background:#ff6b6b"></div> 선택 링크</div>
  <div class="legend-item"><div class="legend-color" style="background:#ffd700"></div> 다음 링크</div>
  <div class="legend-item"><div class="legend-color" style="background:#ff9800"></div> 이전 링크</div>
  <div class="legend-item"><div class="legend-color" style="background:#69f0ae"></div> 오른쪽 링크</div>
  <div class="legend-item"><div class="legend-color" style="background:#ce93d8"></div> 왼쪽 링크</div>
  <div class="section-title">교차로별 색상 (intersection_id)</div>
  <div id="int-legend"></div>
  <div class="filter-group">
    <label>필터:</label>
    <select id="intFilter">
      <option value="all">전체 표시</option>
      <option value="has_signal">신호 링크만</option>
      <option value="80">교차로 80</option>
      <option value="134">교차로 134</option>
      <option value="135">교차로 135</option>
      <option value="136">교차로 136</option>
      <option value="291">교차로 291</option>
      <option value="301">교차로 301</option>
      <option value="510">교차로 510</option>
      <option value="511">교차로 511</option>
      <option value="512">교차로 512</option>
    </select>
  </div>
  <div id="detail-content">
    <div class="hint" id="no-select-msg">← 지도에서 링크를 클릭하세요</div>
  </div>
</div>

}

  var rel = { next:[], prev:[], right:[], left:[] };

}

function onClickLink(e, layer, feature) {
  var p = feature.properties;
  if (selectedId === p.LINK_ID) return;
  selectedId = p.LINK_ID;
  resetStyles();
  layer.setStyle({ color: COLOR.selected, weight: 5, opacity: 1 });
  var rel = getRelatedIds(p);
  rel.next.forEach(function(id) { highlightLink(id, COLOR.next); });
  rel.prev.forEach(function(id) { highlightLink(id, COLOR.prev); });
  rel.right.forEach(function(id) { highlightLink(id, COLOR.right); });
  rel.left.forEach(function(id) { highlightLink(id, COLOR.left); });
  renderPanel(p, rel);

  var manS = p.MANUAVER !== 0 ? '<span style="color:#f9e2af;font-weight:bold">' + manL + '</span>' : '<span class="field-value">' + manL + '</span>';

  document.getElementById('detail-content').innerHTML =

    + '<div class="section-title">기본 정보</div>'

    + fieldRowA('길이 (m)', p.length)

    + '<div class="field-row"><span class="field-name" style="color:#f9e2af">intersection_id</span>' + iidS + '</div>'
    + '<div class="field-row"><span class="field-name" style="color:#f9e2af">signalGroupID</span>' + sgS + '</div>'
    + '<div class="field-row"><span class="field-name" style="color:#f9e2af">MANUAVER</span>' + manS + '</div>'
    + '<div class="section-title">차선변경</div>'
    + fieldRowA('have_to_LC_left', p.have_to_LC_left) + fieldRowA('have_to_LC_right', p.have_to_LC_right)
    + fieldRowA('left_LC_avail', p.left_LC_avail) + fieldRowA('right_LC_avail', p.right_LC_avail)

    + fieldRow('LEFT_LINK_ID', p.LEFT_LINK_ID)
    + fieldRow('다음 링크', next) + fieldRow('이전 링크', prev)

geojsonLayer = L.geoJSON(__geojsonData, {
  style: styleFeature,
  onEachFeature: function(feature, layer) {
    layerMap[feature.properties.LINK_ID] = layer;
    layer.bindTooltip(String(feature.properties.LINK_ID), {
      permanent: false, direction:'center', className:'link-tooltip', opacity:0.9
    });
    layer.on('click', function(e) { L.DomEvent.stopPropagation(e); onClickLink(e, layer, feature); });
    layer.on('mouseover', function() {
      if (feature.properties.LINK_ID !== selectedId)
        layer.setStyle({ color:'#89b4fa', weight:4, opacity:1 });
    });
    layer.on('mouseout', function() {
      if (feature.properties.LINK_ID !== selectedId)
        geojsonLayer.resetStyle(layer);
    });
  }
}).addTo(map);

map.fitBounds(geojsonLayer.getBounds(), { padding: [20, 20] });

// intersection legend
var intLegend = document.getElementById('int-legend');
Object.keys(INT_COLORS).forEach(function(id) {
  var div = document.createElement('div');
  div.className = 'legend-item';
  div.innerHTML = '<div class="legend-color" style="background:' + INT_COLORS[id] + '"></div> ' + id;
  intLegend.appendChild(div);
});

// Filter control
document.getElementById('intFilter').addEventListener('change', function() {
  var val = this.value;
  geojsonLayer.eachLayer(function(l) {
    var p = l.feature.properties;
    if (val === 'all') {
      geojsonLayer.resetStyle(l);
    } else if (val === 'has_signal') {
      if (p.intersection_id === 0 && p.signalGroupID === 0)
        l.setStyle({ opacity: 0.12, weight: 1 });
      else
        l.setStyle(styleFeature(l.feature));
    } else {
      var fid = parseInt(val);
      if (p.intersection_id === fid)
        l.setStyle({ color: INT_COLORS[fid], weight: 5, opacity: 1 });
      else
        l.setStyle({ opacity: 0.12, weight: 1 });
    }
  });
});

map.on('click', function() {
  if (selectedId) {
    selectedId = null; resetStyles();
    document.getElementById('intFilter').dispatchEvent(new Event('change'));
    document.getElementById('detail-content').innerHTML = '<div class="hint">← 지도에서 링크를 클릭하세요</div>';
  }
});
</script>
