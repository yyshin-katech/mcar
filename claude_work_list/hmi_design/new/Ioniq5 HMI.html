<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Ioniq5 HMI — Tesla/Rivian charcoal + amber</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Pretendard:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="hmi/styles.css" />
<style>
  html, body {
    margin: 0; padding: 0;
    background: #08090B;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Inter", sans-serif;
  }
  .frame {
    width: 1600px;
    height: 900px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.04);
    border-radius: 8px;
    overflow: hidden;
  }
</style>
</head>
<body>
  <div class="frame" data-screen-label="01 HMI · Charcoal + Amber">
    <div id="root"></div>
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="hmi/components.jsx"></script>
  <script type="text/babel" src="hmi/HMIScreen.jsx"></script>
  <script type="text/babel">
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<HMIScreen />);
  </script>
</body>
</html>
